<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StealthSearch — Private & Ad-Free</title>
  <style>
    :root {
      --bg: #12141d;
      --surface: #1b1e2b;
      --surface-hover: #242838;
      --border: #2e3348;
      --text: #f1f3f9;
      --muted: #98a0b8;
      --accent: #657ef8;
      --accent-hover: #526be8;
      --green: #34d399;
      --danger: #f87171;
    }

    body.light {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-hover: #eef0f7;
      --border: #dce0ec;
      --text: #181b26;
      --muted: #5e667d;
      --accent: #4f67eb;
      --accent-hover: #3f56d6;
      --green: #059669;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, color 0.2s;
    }

    /* Top Nav */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.14);
      color: var(--green);
      font-weight: 600;
    }

    .nav-actions { display: flex; gap: 10px; }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      transition: 0.15s;
    }

    button:hover { background: var(--surface-hover); }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover { background: var(--accent-hover); }

    /* Screens */
    .hidden { display: none !important; }

    /* Lock Screen */
    #lockScreen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
    }

    .card h1 { font-size: 1.4rem; margin-bottom: 8px; }
    .card p { color: var(--muted); font-size: 0.92rem; margin-bottom: 20px; line-height: 1.5; }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 10px;
      min-height: 20px;
    }

    /* Main Search Area */
    #appScreen {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .hero {
      max-width: 680px;
      width: 100%;
      margin: 10vh auto 24px;
      padding: 0 20px;
      text-align: center;
      transition: margin 0.25s;
    }

    .hero.compact {
      margin: 20px auto 16px;
    }

    .hero h2 { font-size: 2rem; margin-bottom: 8px; }
    .hero.compact h2, .hero.compact .subtitle { display: none; }
    .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.95rem; }

    .search-box {
      display: flex;
      gap: 8px;
    }

    .quick-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .pill {
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 999px;
      color: var(--muted);
    }

    /* Results & Anonymous View */
    .content-area {
      max-width: 960px;
      width: 100%;
      margin: 0 auto 40px;
      padding: 0 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .result-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }

    .result-url { color: var(--green); font-size: 0.82rem; margin-bottom: 4px; word-break: break-all; }
    .result-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
    .result-snippet { color: var(--muted); font-size: 0.9rem; line-height: 1.45; margin-bottom: 10px; }

    .anon-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .anon-info { font-size: 0.85rem; color: var(--muted); word-break: break-all; }
    .anon-info strong { color: var(--green); }

    iframe {
      width: 100%;
      height: 70vh;
      border: 1px solid var(--border);
      border-radius: 0 0 12px 12px;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand" onclick="resetHome()">
      <span>🛡️ StealthSearch</span>
      <span class="badge">Zero Logs • Ad-Free</span>
    </div>
    <div class="nav-actions">
      <button onclick="toggleTheme()" id="themeBtn">☀️ Light</button>
      <button onclick="lockApp()" id="lockBtn" class="hidden">🔒 Lock</button>
    </div>
  </header>

  <!-- Password Gate -->
  <main id="lockScreen">
    <div class="card">
      <h1>Private Access</h1>
      <p>Enter the shared passphrase to connect to the privacy proxy.</p>
      <form onsubmit="unlockApp(event)">
        <input type="password" id="passwordInput" placeholder="Enter access password..." required />
        <button type="submit" class="primary" style="width: 100%; margin-top: 12px;" id="unlockBtn">
          Unlock Search
        </button>
      </form>
      <div class="error-msg" id="lockError"></div>
    </div>
  </main>

  <!-- Main App -->
  <main id="appScreen" class="hidden">
    <section class="hero" id="heroSection">
      <h2>Browse & Search Without Trackers</h2>
      <p class="subtitle">Type any website URL to open it in <strong>Anonymous View</strong>, or enter keywords for a demo search.</p>

      <form class="search-box" onsubmit="runQuery(event)">
        <input type="text" id="queryInput" placeholder="Try wikipedia.org, example.com, or a search phrase..." required />
        <button type="submit" class="primary" id="searchBtn">Go</button>
      </form>

      <div class="quick-pills" id="quickPills">
        <button type="button" class="pill" onclick="quickTry('example.com')">🔗 example.com</button>
        <button type="button" class="pill" onclick="quickTry('en.wikipedia.org/wiki/Privacy')">🔗
