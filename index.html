<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>my test website project pls dont close</title>
  <style>
    :root {
      --bg: #0f111a;
      --surface: #1a1d2d;
      --border: #2c3149;
      --text: #e6e8f0;
      --muted: #9499b3;
      --accent: #6573ff;
      --accent-hover: #505ee8;
      --danger: #ff5c77;
    }

    body.light {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --border: #dcdfec;
      --text: #1b1e2b;
      --muted: #636982;
      --accent: #4c5be8;
      --accent-hover: #3b49d1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .brand { font-weight: 700; font-size: 1.1rem; letter-spacing: 0.3px; }
    .brand span { color: var(--accent); }

    .header-actions { display: flex; gap: 10px; }

    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button:hover { border-color: var(--accent); }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    button.primary:hover { background: var(--accent-hover); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 20px;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
      margin-top: 60px;
      text-align: center;
    }

    .card h2 { margin-bottom: 8px; font-size: 1.3rem; }
    .card p { color: var(--muted); font-size: 0.92rem; margin-bottom: 20px; }

    .search-box {
      width: 100%;
      max-width: 760px;
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    input[type="text"], input[type="password"] {
      flex: 1;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    .options-row {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .quick-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .quick-links button { padding: 4px 10px; font-size: 0.82rem; }

    .error {
      color: var(--danger);
      margin-bottom: 14px;
      font-size: 0.92rem;
    }

    .viewer-container {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      min-height: 600px;
    }

    .viewer-bar {
      background: var(--surface);
      color: var(--text);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
    }

    iframe {
      width: 100%;
      flex: 1;
      border: none;
      min-height: 560px;
      background: #fff;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Private<span>View</span> <small style="font-weight:400;color:var(--muted);">(Test Mode)</small></div>
    <div class="header-actions">
      <button id="themeBtn" type="button">Toggle Theme</button>
      <button id="lockBtn" type="button" class="hidden">Lock</button>
    </div>
  </header>

  <main>
    <!-- Password Gate -->
    <section id="loginView" class="card">
      <h2>Enter Access Password</h2>
      <p>Protected test portal. Enter the shared password to unlock.</p>
      <div id="loginError" class="error hidden"></div>
      <form id="loginForm" style="display:flex;flex-direction:column;gap:12px;">
        <input id="passwordInput" type="password" placeholder="Access password..." required />
        <button type="submit" class="primary">Unlock</button>
      </form>
    </section>

    <!-- URL Viewer -->
    <section id="appView" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center;flex:1;">
      <form id="urlForm" class="search-box">
        <input id="urlInput" type="text" placeholder="Enter a URL to view via Supabase (e.g. example.com)..." required />
        <button id="goBtn" type="submit" class="primary">View Privately</button>
      </form>

      <div class="options-row">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input id="stripAssetsCheck" type="checkbox" />
          Strict mode (strip images &amp; external CSS so your browser makes zero direct requests)
        </label>
        <div class="quick-links">
          <span>Try:</span>
          <button type="button" data-url="https://example.com">example.com</button>
          <button type="button" data-url="https://info.cern.ch">info.cern.ch</button>
          <button type="button" data-url="https://en.wikipedia.org/wiki/Startpage">Wikipedia: Startpage</button>
        </div>
      </div>

      <div id="appError" class="error hidden"></div>

      <div id="viewerContainer" class="viewer-container hidden">
        <div class="viewer-bar">
          <strong id="pageTitle">Page Title</strong>
          <span id="pageUrl" style="color:var(--muted);"></span>
        </div>
        <!-- sandbox="" blocks all scripts inside the previewed page -->
        <iframe id="previewFrame" sandbox=""></iframe>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_FUNCTION_URL = "https://kydjfvycdgwoifhzwrao.supabase.co/functions/v1/proxy";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_rzezrD7o5Y7zAk7I41eM0w_5FayE9cW";

    const loginView = document.getElementById("loginView");
    const appView = document.getElementById("appView");
    const lockBtn = document.getElementById("lockBtn");
    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("passwordInput");
    const loginError = document.getElementById("loginError");
    const urlForm = document.getElementById("urlForm");
    const urlInput = document.getElementById("urlInput");
    const goBtn = document.getElementById("goBtn");
    const appError = document.getElementById("appError");
    const viewerContainer = document.getElementById("viewerContainer");
    const previewFrame = document.getElementById("previewFrame");
    const pageTitle = document.getElementById("pageTitle");
    const pageUrl = document.getElementById("pageUrl");
    const stripAssetsCheck = document.getElementById("stripAssetsCheck");

    // Theme handling
    if (localStorage.getItem("theme") === "light") {
      document.body.classList.add("light");
    }
    document.getElementById("themeBtn").addEventListener("click", () => {
      document.body.classList.toggle("light");
      localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
    });

    function showApp() {
      loginView.classList.add("hidden");
      appView.classList.remove("hidden");
      lockBtn.classList.remove("hidden");
    }

    function showLogin(message = "") {
      localStorage.removeItem("access_password");
      appView.classList.add("hidden");
      lockBtn.classList.add("hidden");
      loginView.classList.remove("hidden");
      if (message) {
        loginError.textContent = message;
        loginError.classList.remove("hidden");
      } else {
        loginError.classList.add("hidden");
      }
    }

    if (localStorage.getItem("access_password")) {
      showApp();
    }

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const pw = passwordInput.value.trim();
      if (!pw) return;
      localStorage.setItem("access_password", pw);
      passwordInput.value = "";
      loginError.classList.add("hidden");
      showApp();
    });

    lockBtn.addEventListener("click", () => showLogin());

    async function loadUrl(targetUrl) {
      const pw = localStorage.getItem("access_password");
      if (!pw) return showLogin();

      appError.classList.add("hidden");
      goBtn.disabled = true;
      goBtn.textContent = "Loading...";

      try {
        const res = await fetch(SUPABASE_FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
            "x-access-password": pw
          },
          body: JSON.stringify({
            url: targetUrl,
            stripAssets: stripAssetsCheck.checked
          })
        });

        const data = await res.json();

        if (res.status === 401) {
          showLogin("Incorrect password. Please try again.");
          return;
        }

        if (!res.ok) {
          appError.textContent = data.error || "Failed to load page.";
          appError.classList.remove("hidden");
          return;
        }

        pageTitle.textContent = data.title;
        pageUrl.textContent = data.finalUrl;
        previewFrame.srcdoc = data.html;
        viewerContainer.classList.remove("hidden");
      } catch (_err) {
        appError.textContent = "Network error reaching Supabase.";
        appError.classList.remove("hidden");
      } finally {
        goBtn.disabled = false;
        goBtn.textContent = "View Privately";
      }
    }

    urlForm.addEventListener("submit", (e) => {
      e.preventDefault();
      if (urlInput.value.trim()) {
        loadUrl(urlInput.value.trim());
      }
    });

    document.querySelectorAll("[data-url]").forEach((btn) => {
      btn.addEventListener("click", () => {
        urlInput.value = btn.dataset.url;
        loadUrl(btn.dataset.url);
      });
    });
  </script>
</body>
</html>
